<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - Profile Setup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center text-primary">FitBuddy AI Generator</h1>
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
        <form action="/generate-plan" method="post">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Weight (kg)</label>
                <input type="number" name="weight" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Fitness Goal</label>
                <select name="fitness_goal" class="form-select">
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="Endurance">Endurance</option>
                    <option value="General Health">General Health</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Workout Intensity</label>
                <select name="workout_intensity" class="form-select">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Generate Plan</button>
        </form>
    </div>
</div>
</body>
</html>
