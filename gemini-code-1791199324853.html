<!DOCTYPE html>
<html>
<head>
    <title>Your FitBuddy Plan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2>Welcome, {{ user.name }}!</h2>
    <div class="row mt-4">
        <div class="col-md-8">
            <div class="card p-4 shadow-sm mb-4">
                <h3>7-Day Workout Schedule</h3>
                <pre style="white-space: pre-wrap; font-family: inherit;">{{ plan.plan_content }}</pre>
            </div>
            <div class="card p-4 shadow-sm">
                <h4>Feedback & Refinement</h4>
                <form action="/update-plan/{{ plan.id }}" method="post">
                    <div class="mb-3">
                        <textarea name="feedback" class="form-control" rows="3" placeholder="e.g., Focus more on leg days, or add 1 more rest day."></textarea>
                    </div>
                    <button type="submit" class="btn btn-warning">Update Plan with AI</button>
                </form>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 shadow-sm bg-info text-white">
                <h4>Nutrition & Recovery Tips</h4>
                <p style="white-space: pre-wrap;">{{ plan.nutrition_tip }}</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
